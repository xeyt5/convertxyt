name: Publicar versión

# Se lanza con `npm version patch && git push --follow-tags`.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      # Si un sistema falla, el otro termina igual: se ven todos los errores de una vez.
      fail-fast: false
      matrix:
        # Ubuntu antiguo a propósito: el AppImage funciona en sistemas iguales o más nuevos.
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias de Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Descargar yt-dlp, ffmpeg y Deno
        run: node scripts/fetch-tools.mjs

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ github.ref_name }}
          releaseName: convertxyt ${{ github.ref_name }}
          releaseBody: Descarga el AppImage para Linux o el instalador .exe para Windows.
          releaseDraft: true
          args: --config src-tauri/tauri.release.conf.json

  # La versión solo se hace pública, y solo llega a los usuarios, si compilaron los dos sistemas.
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
